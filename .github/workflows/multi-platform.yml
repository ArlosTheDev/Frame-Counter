name: Build Geode Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Geode CLI
        uses: geode-sdk/install-geode-cli@main

      - name: Build Mod
        run: geode build --config Release